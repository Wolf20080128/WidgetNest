name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore WidgetNest.slnx

      - name: 编译
        run: dotnet build WidgetNest.slnx -c Release --no-restore

      - name: 发布单文件 exe
        run: >
          dotnet publish WidgetNest.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WidgetNest-win-x64
          path: publish/win-x64/WidgetNest.exe
          if-no-files-found: error
